version: 2

models:
  - name: int_batch_file_inventory
    description: One row per dataset and S3 file with batch metadata and row counts.
    columns:
      - name: dataset_name
        tests: [not_null]
      - name: batch_id
        tests: [not_null]
      - name: source_file
        tests: [not_null]
      - name: row_count
        tests: [not_null]

  - name: int_batch_status
    description: Batch-level completeness status across the seven expected datasets.
    columns:
      - name: batch_id
        tests: [unique, not_null]
      - name: dataset_count
        tests: [not_null]
      - name: is_complete
        tests: [not_null]

  - name: int_latest_complete_batch
    description: Latest observed batch. Materialization fails by division by zero unless it is complete.
    columns:
      - name: batch_id
        tests: [unique, not_null]
      - name: completeness_gate
        tests:
          - accepted_values:
              arguments:
                values: [1]
                quote: false

