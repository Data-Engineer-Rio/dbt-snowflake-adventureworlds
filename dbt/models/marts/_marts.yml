version: 2

models:
  - name: dim_date
    description: Conformed date dimension used by order, due and ship date roles.
    columns:
      - name: date_key
        description: Integer date key in YYYYMMDD form.
        tests: [unique, not_null]
      - name: date_value
        tests: [unique, not_null]

  - name: dim_customer
    description: Customer SCD Type 2 history. Filter IS_CURRENT for a current-state star-schema join.
    columns:
      - name: customer_version_key
        tests: [unique, not_null]
      - name: customer_key
        tests: [not_null]
      - name: customer_name
        tests: [not_null]
      - name: valid_from
        tests: [not_null]
      - name: is_current
        tests: [not_null]

  - name: dim_reseller
    description: Reseller SCD Type 2 history. Filter IS_CURRENT for a current-state star-schema join.
    columns:
      - name: reseller_version_key
        tests: [unique, not_null]
      - name: reseller_key
        tests: [not_null]
      - name: reseller_name
        tests: [not_null]
      - name: valid_from
        tests: [not_null]
      - name: is_current
        tests: [not_null]

  - name: dim_product
    description: Product SCD Type 2 history. Filter IS_CURRENT for a current-state star-schema join.
    columns:
      - name: product_version_key
        tests: [unique, not_null]
      - name: product_key
        tests: [not_null]
      - name: product_name
        tests: [not_null]
      - name: valid_from
        tests: [not_null]
      - name: is_current
        tests: [not_null]

  - name: dim_sales_territory
    description: Sales-territory SCD Type 2 history.
    columns:
      - name: sales_territory_version_key
        tests: [unique, not_null]
      - name: sales_territory_key
        tests: [not_null]
      - name: region
        tests: [not_null]
      - name: valid_from
        tests: [not_null]
      - name: is_current
        tests: [not_null]

  - name: fct_sales_order_line
    description: Analytical sales fact at one row per SalesOrderLineKey, merged from each latest complete full snapshot.
    config:
      contract:
        enforced: false
    columns:
      - name: sales_order_line_key
        description: Fact grain and incremental merge key.
        tests: [unique, not_null]
      - name: sales_order_number
        tests: [not_null]
      - name: channel
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Internet', 'Reseller']
      - name: customer_version_key
        tests: [not_null]
      - name: reseller_version_key
        tests: [not_null]
      - name: product_version_key
        tests: [not_null]
      - name: sales_territory_version_key
        tests: [not_null]
      - name: order_date
        tests: [not_null]
      - name: order_quantity
        tests: [not_null]
      - name: sales_amount
        description: Authoritative source sales amount.
        tests: [not_null]
      - name: discount_amount
        description: Extended amount less source sales amount.
        tests: [not_null]
      - name: gross_profit_amount
        description: Sales amount less total product cost.
        tests: [not_null]
      - name: batch_id
        tests: [not_null]
      - name: record_hash
        tests: [not_null]

